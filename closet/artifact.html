<title>Valet Wardrobe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column on phones with a bottom tab bar; from 960px a left rail and a centred 1080px workspace.
   Look: cool porcelain ground, white garment tiles like a fitting-room rail, one mulberry accent, Didone for names. */
:root {
  --bg: #f2f3f6;
  --surface: #ffffff;
  --surface-2: #eaecf1;
  --ink: #16171b;
  --ink-2: #464953;
  --muted: #747885;
  --line: #dfe2e8;
  --accent: #6d2552;
  --accent-ink: #ffffff;
  --accent-soft: #f4e7ef;
  --board: #ffffff;
  --tile: #ffffff;
  --good: #2c7a4b; --good-soft: #e3f2e8;
  --warn: #9a640f; --warn-soft: #fbf0dc;
  --bad: #b1352a;  --bad-soft: #fbe6e3;
  --scrim: rgba(18, 19, 24, .42);
  --shadow: 0 1px 2px rgba(22, 24, 32, .05), 0 8px 28px rgba(22, 24, 32, .07);
  --shadow-lg: 0 24px 60px rgba(22, 24, 32, .22);
  --f-display: 'Bodoni Moda', 'Bodoni 72', Didot, 'Times New Roman', serif;
  --f-ui: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 16px; --r-sm: 10px; --tabh: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111215; --surface: #1a1b20; --surface-2: #24262d; --ink: #eeeff3; --ink-2: #c4c6ce; --muted: #8f929d; --line: #2d2f37;
    --accent: #e490bf; --accent-ink: #2b0c1e; --accent-soft: #3a2130; --board: #202228; --tile: #f4f4f2;
    --good: #72c995; --good-soft: #1d3326; --warn: #e3ac55; --warn-soft: #382b16; --bad: #f0857a; --bad-soft: #3d1f1c;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111215; --surface: #1a1b20; --surface-2: #24262d; --ink: #eeeff3; --ink-2: #c4c6ce; --muted: #8f929d; --line: #2d2f37;
  --accent: #e490bf; --accent-ink: #2b0c1e; --accent-soft: #3a2130; --board: #202228; --tile: #f4f4f2;
  --good: #72c995; --good-soft: #1d3326; --warn: #e3ac55; --warn-soft: #382b16; --bad: #f0857a; --bad-soft: #3d1f1c;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ic { width: 20px; height: 20px; flex: none; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.display { font-family: var(--f-display); font-weight: 500; letter-spacing: -.01em; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.shell { min-height: 100%; padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 24px); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.wordmark { font-family: var(--f-display); font-style: italic; font-size: 26px; font-weight: 600; letter-spacing: -.02em; color: var(--ink); text-decoration: none; line-height: 1; }
.wordmark i { color: var(--accent); font-style: normal; }
.mode-pill { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
.iconbtn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 12px; border: 0; background: transparent; color: var(--ink); }
.iconbtn:hover { background: var(--surface-2); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; border: 0; }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1080px; margin: 0 auto; padding-top: 8px; display: flex; flex-direction: column; gap: 22px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-title { font-family: var(--f-display); font-size: clamp(28px, 6vw, 40px); font-weight: 500; line-height: 1.08; letter-spacing: -.015em; }
.section-title { font-size: 17px; font-weight: 700; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { height: var(--tabh); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.fab { position: fixed; z-index: 26; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(var(--tabh) + 16px + env(safe-area-inset-bottom, 0px)); height: 52px; padding: 0 20px 0 16px;
  border-radius: 26px; border: 0; background: var(--ink); color: var(--bg); display: flex; align-items: center; gap: 8px; font-weight: 700; box-shadow: var(--shadow-lg); }
.fab .ic { width: 22px; height: 22px; }
@media (min-width: 960px) {
  .shell { padding-left: 92px; padding-bottom: 48px; }
  .tabbar { top: 0; right: auto; width: 92px; display: flex; flex-direction: column; justify-content: flex-start; padding-top: 86px; border-top: 0; border-right: 1px solid var(--line); gap: 4px; }
  .tab { height: 68px; }
  .fab { bottom: 28px; right: 28px; }
  .topbar { padding-left: 24px; }
}

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; font-size: 14px; white-space: nowrap; color: var(--ink); text-decoration: none; }
.btn:hover { border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.quiet { border-color: transparent; background: transparent; padding: 0 10px; }
.btn.quiet:hover { background: var(--surface-2); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.danger { color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.chip .ic { width: 16px; height: 16px; }
button.chip:hover { border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
.chip[aria-pressed="true"], .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.soft { background: var(--surface-2); border-color: transparent; }
.chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); gap: 2px; }
.seg button { border: 0; background: transparent; height: 34px; padding: 0 14px; border-radius: 9px; font-weight: 650; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.badge.good { background: var(--good-soft); color: var(--good); } .badge.warn { background: var(--warn-soft); color: var(--warn); } .badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .label { font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
.input, select.input, textarea.input { width: 100%; min-height: 42px; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { min-height: 120px; resize: vertical; line-height: 1.45; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.range { width: 100%; accent-color: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; position: relative; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.sw[aria-pressed="true"]::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--surface); opacity: .9; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); flex: none; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle:last-child { border-bottom: 0; }
.switch { appearance: none; width: 44px; height: 26px; border-radius: 13px; background: var(--surface-2); position: relative; border: 1px solid var(--line); flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch:checked { background: var(--accent); border-color: var(--accent); }
.switch:checked::after { transform: translateX(18px); }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; min-width: 0; }
.li-btn { width: 100%; text-align: left; border: 0; background: none; padding: 12px 0; display: flex; align-items: center; gap: 12px; }
.note { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font-size: 13.5px; align-items: flex-start; }
.note .ic { margin-top: 1px; }
.note.accent { background: var(--accent-soft); color: var(--ink); }
.note.warn { background: var(--warn-soft); color: var(--ink); }
.empty { text-align: center; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty .art { width: 120px; height: 120px; opacity: .9; }
.empty h3 { font-family: var(--f-display); font-weight: 500; font-size: 24px; }
.empty p { color: var(--muted); max-width: 42ch; }

/* ---------- outfit board (flat-lay) ---------- */
.board { background: var(--board); border-radius: 20px; padding: 14px; display: grid; gap: 10px; grid-template-columns: 1fr 1.25fr 0.8fr;
  grid-template-areas: "outer main side" "layer main side"; box-shadow: var(--shadow); min-height: 300px; }
.board .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.board .c-left { grid-area: outer / outer / layer / layer; }
.board .c-main { grid-area: main; }
.board .c-side { grid-area: side; }
.board .accs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.board .accs .piece .cap { display: none; }
.board .accs.one { grid-template-columns: 1fr; }
.piece { position: relative; border: 0; padding: 0; background: var(--tile); border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; aspect-ratio: 1; width: 100%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .05); }
.piece.tall { aspect-ratio: .82; }
.piece img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.piece .gsvg { width: 82%; height: 82%; }
.piece.sm .gsvg { width: 74%; height: 74%; }
.piece .lockmark { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.piece .lockmark .ic { width: 13px; height: 13px; }
.piece .cap { position: absolute; left: 6px; right: 6px; bottom: 6px; font-size: 10.5px; font-weight: 650; color: #3a3c44; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(255, 255, 255, .86); border-radius: 6px; padding: 2px 6px; }
button.piece:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.board-empty { grid-column: 1 / -1; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 30px; }
.mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--board); border-radius: 12px; padding: 6px; }
.mini .piece { border-radius: 8px; }
.mini .piece .gsvg { width: 86%; height: 86%; }
.mini.five { grid-template-columns: repeat(5, 1fr); }

.outfit-card { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .outfit-card { grid-template-columns: 1fr; } }
.why { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.why li { display: flex; gap: 10px; font-size: 14px; color: var(--ink-2); }
.why li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 8px; flex: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.wx { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.wx .ic { width: 22px; height: 22px; color: var(--accent); }
.wx-big { font-family: var(--f-display); font-size: 40px; line-height: 1; font-weight: 500; }
.today-hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
.events { display: flex; flex-direction: column; gap: 6px; }
.ev { display: flex; align-items: center; gap: 10px; font-size: 13.5px; min-width: 0; }
.ev .t { width: 52px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; font-size: 12.5px; }
.ev .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- week ---------- */
.week { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .week { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1100px) { .week { grid-template-columns: repeat(4, 1fr); } }
.day { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 10px; border: 0; text-align: left; position: relative; min-width: 0; }
.day.is-today { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.day.past { opacity: .72; }
.day-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.day-name { font-family: var(--f-display); font-size: 21px; font-weight: 500; }
.day-meta { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.day-meta .ic { width: 16px; height: 16px; }

/* ---------- closet grid ---------- */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search { position: relative; flex: 1; min-width: 180px; }
.search .ic { position: absolute; left: 12px; top: 11px; color: var(--muted); }
.search input { padding-left: 38px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .items { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
.item { border: 0; padding: 0; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); text-align: left; overflow: hidden; display: flex; flex-direction: column; min-width: 0; position: relative; }
.item .piece { border-radius: 0; box-shadow: none; aspect-ratio: 1; }
.item-b { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item-n { font-weight: 650; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-m { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.item .flag { position: absolute; top: 8px; left: 8px; }
.item .fav { position: absolute; top: 8px; right: 8px; color: var(--accent); }
.item .fav .ic { width: 18px; height: 18px; fill: currentColor; }
.item.sel { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }

/* care-label stat tag */
.tagline { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 12px; font-variant-numeric: tabular-nums; }
.tagline span { padding: 3px 8px; }
.tagline span + span { border-left: 1px dashed var(--line); }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade .18s ease; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 92vh; background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: rise .24s cubic-bezier(.2, .8, .2, 1); }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-h h2 { font-family: var(--f-display); font-weight: 500; font-size: 24px; flex: 1; min-width: 0; }
.sheet-b { overflow: auto; padding: 4px 16px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sheet-f { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; background: var(--bg); border-radius: 0 0 22px 22px; flex-wrap: wrap; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }
@media (min-width: 760px) {
  .sheet { left: 50%; top: 50%; bottom: auto; right: auto; transform: translate(-50%, -50%); width: min(640px, calc(100vw - 48px)); max-height: 86vh; border-radius: 22px; animation: pop .2s ease; }
  .sheet.wide { width: min(920px, calc(100vw - 48px)); }
  .grab { display: none; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
@keyframes pop { from { transform: translate(-50%, -48%); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .toast { animation: none !important; } }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabh) + 84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-lg); max-width: calc(100vw - 32px); animation: rise .2s ease; display: flex; gap: 12px; align-items: center; }

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((s, v) => s + (+v || 0), 0);
const by = (fn, dir = 1) => (a, b) => { const x = fn(a), y = fn(b); return x < y ? -dir : x > y ? dir : 0; };
const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const cap = (s) => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);
const plural = (n, w, pw) => `${n} ${n === 1 ? w : (pw || w + 's')}`;

function lsGet(k, d) { try { const v = localStorage.getItem('valet:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem('valet:' + k, JSON.stringify(v)); } catch { /* storage blocked */ } }

/* dates — always local calendar days as YYYY-MM-DD */
const pad = (n) => String(n).padStart(2, '0');
const iso = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const today = () => iso(new Date());
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const dow = (s) => parseISO(s).getDay();
const fmtDay = (s) => { const d = parseISO(s); return `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtLong = (s) => { const d = parseISO(s); return `${DOW_LONG[d.getDay()]}, ${MON_LONG[d.getMonth()]} ${d.getDate()}`; };
const fmtShort = (s) => { const d = parseISO(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtMonthYear = (s) => { const d = parseISO(s); return `${MON[d.getMonth()]} ${d.getFullYear()}`; };
function weekStartOf(s, startDow = 1) { const d = parseISO(s); const diff = (d.getDay() - startDow + 7) % 7; d.setDate(d.getDate() - diff); return iso(d); }
function seasonOf(s, lat = 38) {
  const m = parseISO(s).getMonth();
  const north = ['winter', 'winter', 'spring', 'spring', 'spring', 'summer', 'summer', 'summer', 'fall', 'fall', 'fall', 'winter'][m];
  if (lat >= 0) return north;
  return { winter: 'summer', summer: 'winter', spring: 'fall', fall: 'spring' }[north];
}
function relDays(s) {
  if (!s) return 'never';
  const n = daysBetween(s, today());
  if (n <= 0) return 'today'; if (n === 1) return 'yesterday'; if (n < 14) return `${n} days ago`;
  if (n < 60) return `${Math.round(n / 7)} weeks ago`; if (n < 365) return `${Math.round(n / 30)} months ago`;
  return `${(n / 365).toFixed(1).replace('.0', '')} years ago`;
}

/* money */
const money = (v, dec) => {
  if (v == null || v === '' || isNaN(v)) return '—';
  const d = dec ?? (Math.abs(v) < 10 && v % 1 ? 2 : 0);
  return '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
};
const parseMoney = (s) => { const m = String(s ?? '').replace(/,/g, '').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };

/* temperatures are stored in °F; shown in the profile's unit */
const tempOut = (f) => (f == null ? '–' : Math.round(S.profile?.units === 'C' ? (f - 32) * 5 / 9 : f) + '°');

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* colour maths for photo swatches */
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbDist(a, b) { const rm = (a[0] + b[0]) / 2; const dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2]; return Math.sqrt((2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db); }
function nearestColor(rgb) {
  let best = 'grey', bd = Infinity;
  for (const [k, c] of Object.entries(COLORS)) { if (c.multi || c.metal) continue; const d = rgbDist(rgb, hexToRgb(c.hex)); if (d < bd) { bd = d; best = k; } }
  return best;
}
function shade(hex, amt) { const [r, g, b] = hexToRgb(hex); const f = (v) => clamp(Math.round(v + (amt < 0 ? v * amt : (255 - v) * amt)), 0, 255); return '#' + [f(r), f(g), f(b)].map((v) => v.toString(16).padStart(2, '0')).join(''); }
function luminance(hex) { const [r, g, b] = hexToRgb(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; }

/* CSV */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; continue; }
    if (c === '"') q = true; else if (c === ',' || c === '\t') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim() !== ''));
}
const csvCell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

/* images: resize to a JPEG blob */
function loadImage(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
async function fileToImage(file) { const url = URL.createObjectURL(file); try { return await loadImage(url); } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); } }
function imageToBlob(img, max = 900, q = 0.84) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob((b) => res(b), 'image/jpeg', q));
}
function blobToDataURL(b) { return new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); }); }

/* dominant garment colour: ignore the background (estimated from the border) */
function dominantColors(img) {
  const N = 64; const c = document.createElement('canvas'); c.width = N; c.height = N;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, N, N);
  const px = x.getImageData(0, 0, N, N).data; const at = (i, j) => { const o = (j * N + i) * 4; return [px[o], px[o + 1], px[o + 2]]; };
  const border = []; for (let i = 0; i < N; i += 4) { border.push(at(i, 0), at(i, N - 1), at(0, i), at(N - 1, i)); }
  const bg = [0, 1, 2].map((k) => sum(border.map((p) => p[k])) / border.length);
  const counts = {};
  for (let j = 6; j < N - 6; j++) for (let i = 6; i < N - 6; i++) {
    const p = at(i, j); if (rgbDist(p, bg) < 70) continue;
    const k = nearestColor(p); const w = 1 - Math.hypot(i - N / 2, j - N / 2) / N; counts[k] = (counts[k] || 0) + w;
  }
  const ranked = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (!ranked.length) return [nearestColor(bg)];
  const total = sum(ranked.map((r) => r[1]));
  return ranked.filter((r, i) => i === 0 || r[1] / total > 0.22).slice(0, 2).map((r) => r[0]);
}

/* ===== store.js ===== */
/* ───────────── state + persistence ─────────────
   One in-memory state, two homes:
   • local  — IndexedDB in this browser (the stand-alone app)
   • cloud  — the artifact's `db` store + `assets` for photos (inside Claude), synced across devices */

const COLLS = ['items', 'outfits', 'plans', 'events', 'trips', 'capsules', 'wishlist', 'log'];
const S = { profile: null, ready: false };
COLLS.forEach((c) => (S[c] = new Map()));

const DEFAULT_PROFILE = () => ({
  name: '', units: 'F', location: null, planDow: 0, weekStartDow: 1,
  workDays: [1, 2, 3, 4, 5], wfhDays: [], workKind: 'work',
  kindLevels: {}, formulas: [], formulaWeights: {}, styleWords: [], favColors: [], avoidColors: [],
  runsCold: false, runsHot: false, heels: true, repeatDays: 10, accessories: 2, favoriteLooks: '', notes: '',
  interviewDone: false, autoPlan: true, created: today(),
});

const Store = {
  mode: 'local', db: null, assets: null, readOnly: false, idb: null, photoCache: new Map(), onChange: null, status: '',

  async init(onChange) {
    this.onChange = onChange;
    const hasClaude = !!(window.claude && typeof window.claude.use === 'function');
    if (hasClaude) {
      const db = await window.claude.use('db').catch(() => null);
      if (db) { this.db = db; this.mode = 'cloud'; this.assets = await window.claude.use('assets').catch(() => null); return this.initCloud(); }
    }
    return this.initLocal();
  },

  /* ---------- local: IndexedDB ---------- */
  async initLocal() {
    try {
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open('valet', 1);
        r.onupgradeneeded = () => { const d = r.result; COLLS.forEach((c) => d.createObjectStore(c, { keyPath: 'id' })); d.createObjectStore('meta'); d.createObjectStore('photos'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      for (const c of COLLS) { const all = await this.idbReq(c, 'readonly', (s) => s.getAll()); all.forEach((o) => S[c].set(o.id, o)); }
      S.profile = Object.assign(DEFAULT_PROFILE(), (await this.idbReq('meta', 'readonly', (s) => s.get('profile'))) || {});
    } catch (e) {
      this.idb = null; this.status = 'This browser is blocking storage, so changes last only until you close the page.';
      S.profile = DEFAULT_PROFILE();
    }
    S.ready = true;
  },
  idbReq(store, mode, fn) {
    return new Promise((res, rej) => { const t = this.idb.transaction(store, mode); const r = fn(t.objectStore(store)); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },

  /* ---------- cloud: artifact db ---------- */
  initCloud() {
    return new Promise((resolve) => {
      let pending = COLLS.length + 1; let done = false;
      const finish = () => { if (done) return; done = true; S.profile = Object.assign(DEFAULT_PROFILE(), S.profile || {}); S.ready = true; resolve(); };
      const timer = setTimeout(() => { this.status = 'Your closet is taking a while to load. Showing what has arrived so far.'; finish(); }, 10000);
      const first = (snap) => { if (!snap.metadata?.fromCache && --pending <= 0) { clearTimeout(timer); this.status = ''; finish(); } };
      const onErr = (e) => { this.status = e?.code === 'revoked' ? 'Access to this closet changed. Reload to continue.' : 'Some closet data could not load.'; if (--pending <= 0) { clearTimeout(timer); finish(); } this.onChange?.(); };
      for (const c of COLLS) {
        let seen = false;
        this.db.collection(c).onSnapshot((snap) => {
          for (const ch of snap.docChanges()) {
            if (ch.type === 'removed') S[c].delete(ch.doc.id); else S[c].set(ch.doc.id, Object.assign(clone(ch.doc.data()), { id: ch.doc.id }));
          }
          if (!seen && !snap.metadata?.fromCache) { seen = true; first(snap); }
          if (done) this.onChange?.(c);
        }, onErr);
      }
      let pSeen = false;
      this.db.doc('meta/profile').onSnapshot((snap) => {
        if (snap.exists) S.profile = Object.assign(DEFAULT_PROFILE(), clone(snap.data()));
        if (!pSeen && !snap.metadata?.fromCache) { pSeen = true; first(snap); }
        if (done) this.onChange?.('profile');
      }, onErr);
    });
  },
  queues: new Map(), inflight: 0, waiting: [],
  slot() { if (this.inflight < 6) { this.inflight++; return Promise.resolve(); } return new Promise((r) => this.waiting.push(r)); },
  release() { const n = this.waiting.shift(); if (n) n(); else this.inflight--; },
  cloudWrite(path, body) {
    let q = this.queues.get(path); if (!q) { q = { busy: false, next: undefined }; this.queues.set(path, q); }
    q.next = body; if (!q.busy) this.pump(path, q);
  },
  async pump(path, q) {
    q.busy = true;
    while (q.next !== undefined) {
      const body = q.next; q.next = undefined;
      const run = async () => { await this.slot(); try { return await (body === null ? this.db.doc(path).delete() : this.db.doc(path).set(body)); } finally { this.release(); } };
      const later = (ms) => new Promise((r) => setTimeout(r, ms + Math.random() * ms));
      try { await run(); } catch (e) {
        if (e?.code === 'unavailable' || e?.code === 'resource_exhausted') {
          let ok = false; for (let k = 1; k <= 3 && !ok; k++) { await later(700 * k); try { await run(); ok = true; } catch { /* next try */ } }
          if (!ok) toast('Couldn’t save just now. Your change will retry on the next edit.');
        }
        else if (e?.code === 'quota_exceeded') toast('Your closet storage is full. Remove photos or retired pieces to make room.');
        else if (e?.code === 'invalid_argument') { this.readOnly = true; toast('This copy of the closet is view-only for you.'); }
        else toast('Couldn’t save that change.');
      }
    }
    q.busy = false;
  },

  /* ---------- public API ---------- */
  put(coll, obj) {
    if (!obj.id) obj.id = uid(coll[0]);
    obj.updated = Date.now();
    S[coll].set(obj.id, obj);
    if (this.mode === 'cloud') { const body = clone(obj); delete body.id; this.cloudWrite(`${coll}/${obj.id}`, body); }
    else if (this.idb) this.idbReq(coll, 'readwrite', (s) => s.put(clone(obj))).catch(() => toast('Couldn’t save that change.'));
    return obj;
  },
  del(coll, id) {
    S[coll].delete(id);
    if (this.mode === 'cloud') this.cloudWrite(`${coll}/${id}`, null);
    else if (this.idb) this.idbReq(coll, 'readwrite', (s) => s.delete(id)).catch(() => {});
  },
  saveProfile(patch) {
    S.profile = Object.assign(S.profile || DEFAULT_PROFILE(), patch || {});
    if (this.mode === 'cloud') this.cloudWrite('meta/profile', clone(S.profile));
    else if (this.idb) this.idbReq('meta', 'readwrite', (s) => s.put(clone(S.profile), 'profile')).catch(() => {});
  },
  async getMeta(key) {
    if (this.mode === 'cloud') { try { const s = await this.db.doc('meta/' + key).get(); return s.exists ? clone(s.data()) : null; } catch { return null; } }

function logWear(itemIds, date = today(), meta = {}) {
  for (const id of itemIds) {
    const it = S.items.get(id); if (!it) continue;
    it.wears = it.wears || []; if (!it.wears.includes(date)) it.wears.push(date); it.wears.sort();
    Store.put('items', it);
  }
  const mk = date.slice(0, 7); const doc = S.log.get(mk) || { id: mk, entries: [] };
  doc.entries = doc.entries.filter((e) => !(e.d === date && e.key === meta.key));
  doc.entries.push(Object.assign({ d: date, items: itemIds }, meta));
  Store.put('log', doc);
}
function unlogWear(itemIds, date) {
  for (const id of itemIds) { const it = S.items.get(id); if (!it || !it.wears) continue; it.wears = it.wears.filter((d) => d !== date); Store.put('items', it); }
  const mk = date.slice(0, 7); const doc = S.log.get(mk);
  if (doc) { doc.entries = doc.entries.filter((e) => e.d !== date || !e.items.every((x) => itemIds.includes(x))); Store.put('log', doc); }
}

function loadSampleCloset() {
  const t = today();
  SAMPLE_CLOSET.forEach(([name, cat, sub, colors, pattern, material, price, store, brand, monthsAgo, wearsN], idx) => {
    const purchased = addDays(t, -Math.round(monthsAgo * 30.4));
    const span = Math.max(7, daysBetween(purchased, t));
    const wears = new Set();
    // deterministic pseudo-random spread so the sample looks lived-in
    let seed = idx * 97 + 13;
    for (let n = 0; n < wearsN * 3 && wears.size < wearsN; n++) { seed = (seed * 9301 + 49297) % 233280; wears.add(addDays(t, -1 - Math.floor((seed / 233280) * Math.min(span, 360)))); }
    const [w, f] = subDefaults(sub);
    Store.put('items', newItem({ name, cat, sub, colors, pattern, material, price, store, brand, purchased, warmth: w, formality: f,
      seasons: material === 'Linen' ? ['spring', 'summer'] : (['Wool coat', 'Puffer', 'Tall boots'].includes(sub) || ['Cashmere', 'Wool'].includes(material) && cat === 'top') ? ['fall', 'winter'] : [],
      wears: [...wears].sort(), sample: true, source: 'sample', fav: wearsN > 30 }));
  });
}
function removeSampleCloset() {
  itemsArr((i) => i.sample).forEach((i) => Store.del('items', i.id));
  for (const [id, p] of S.plans) { if (p.sample) Store.del('plans', id); }
}

const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || IC.info}</svg>`;

/* ===== engine.js ===== */
/* ───────────── outfit engine ─────────────
   Reads the day (weather, calendar, season, your profile), scores every piece for each slot,
   then assembles combinations and keeps the one that scores best as a whole. */

const CORE = new Set(['top', 'bottom', 'dress']);
const CLOTHES = new Set(['top', 'bottom', 'dress', 'layer', 'outer']);
const WARM_MATS = new Set(['Wool', 'Cashmere', 'Velvet', 'Tweed', 'Corduroy', 'Fleece']);

function kindLevel(kind) { return S.profile?.kindLevels?.[kind] ?? KINDS[kind]?.f ?? 3; }

function classifyEvent(ev) {
  if (ev.kind && KINDS[ev.kind]) return ev.kind;
  const text = `${ev.title || ''} ${ev.location || ''} ${(ev.desc || '').slice(0, 200)}`;
  for (const [k, re] of KIND_RULES) if (re.test(text)) return k;
  return null;
}

function baseKind(date) {
  const p = S.profile, d = dow(date);
  if ((p.workDays || []).includes(d)) return (p.wfhDays || []).includes(d) ? 'wfh' : (p.workKind || 'work');
  return 'casual';
}

/* Everything the engine needs to know about a day */
function dayContext(date, over = {}) {
  const p = S.profile;
  const evs = Cal.eventsOn(date).map((e) => Object.assign({}, e, { kind: classifyEvent(e) }));
  const base = baseKind(date);
  let kind = over.kindSet || base; const also = [];
  if (!over.kindSet) {
    let best = { kind: base, f: kindLevel(base), ev: false };
    for (const e of evs) {
      if (!e.kind) continue;
      if (e.kind === 'active') { if (!also.includes('active')) also.push('active'); continue; }
      const f = kindLevel(e.kind);
      if (f > best.f || (f === best.f && !best.ev) || (e.kind === 'travel' && best.kind === 'casual')) best = { kind: e.kind, f, ev: true };
    }
    kind = best.kind;
    if (evs.some((e) => e.kind === 'active') && !evs.some((e) => e.kind && e.kind !== 'active') && base !== 'work' && base !== 'client') kind = 'active';
  }
  if (!over.loc && typeof tripOn === 'function') { const tr = tripOn(date); if (tr) over = Object.assign({}, over, { loc: Object.assign({}, tr.dest, { days: tr.wx || {} }) }); }
  const wx = Object.assign({}, Weather.forDate(date, over.loc), over.wx || {});
  const evening = KINDS[kind]?.evening;
  let t = wx.hi == null ? 62 : (evening ? wx.hi * 0.35 + wx.lo * 0.65 : wx.hi * 0.62 + wx.lo * 0.38);
  if (p.runsCold) t -= 5; if (p.runsHot) t += 5; if ((wx.wind || 0) > 15) t -= 3; if ((wx.rain || 0) >= 50) t -= 2;
  const tier = t >= 80 ? 'hot' : t >= 70 ? 'warm' : t >= 60 ? 'mild' : t >= 50 ? 'cool' : t >= 40 ? 'cold' : 'frigid';
  const lat = over.loc?.lat ?? p.location?.lat ?? 38;
  return {
    date, kind, f: over.f ?? kindLevel(kind), events: evs, also, wx, t, tier,
    rain: (wx.rain || 0) >= 45, sunny: [0, 1].includes(wx.code) && (wx.rain || 0) < 30, season: seasonOf(date, lat),
    comfortShoes: !!KINDS[kind]?.comfortShoes || evs.filter((e) => e.kind === 'showing').length >= 2,
    used: over.used || new Map(), packed: over.packed || null, pool: over.pool || null, lock: over.lock || {}, exclude: over.exclude || new Set(),
    jitter: over.jitter ?? 1.1,
  };
}

const IDEAL_WARMTH = { hot: 1, warm: 1.6, mild: 2.4, cool: 3.2, cold: 4, frigid: 4.6 };

function itemScore(it, ctx, role) {
  const p = S.profile; const why = [];
  const fDiff = Math.abs((it.formality ?? 3) - ctx.f);
  const tol = role === 'acc' || role === 'bag' ? 2.6 : role === 'outer' ? 2.2 : role === 'shoes' ? 1.9 : role === 'layer' ? 1.6 : 1.3;
  if (fDiff > tol) return null;
  if ((['Cocktail dress', 'Gown'].includes(it.sub) || it.material === 'Sequin') && !(KINDS[ctx.kind]?.evening || ctx.f >= 4.5)) return null;
  let s = -fDiff * (role === 'acc' ? 0.6 : 1.5);
  const w = it.warmth ?? 3;
  if (role === 'top' || role === 'dress') s -= Math.abs(w - IDEAL_WARMTH[ctx.tier]) * 0.9;
  if (role === 'bottom') {
    if (['hot', 'warm'].includes(ctx.tier)) s -= Math.max(0, w - 2) * 0.6; else s -= Math.max(0, 2.5 - w) * 1.1;
    if (['cold', 'frigid'].includes(ctx.tier) && ['Shorts', 'Skirt (mini)', 'Active shorts'].includes(it.sub)) s -= 2.5;
  }
  if (it.seasons?.length && !it.seasons.includes(ctx.season)) s -= 1.4;
  const mat = it.material || '';
  if (['hot', 'warm'].includes(ctx.tier) && WARM_MATS.has(mat)) s -= 1.4;
  if (['cold', 'frigid'].includes(ctx.tier) && mat === 'Linen') s -= 1.2;
  if (ctx.rain && (mat === 'Suede' || mat === 'Silk' && role === 'outer')) s -= 2;
  // freshness
  const lw = lastWorn(it); const days = lw ? daysBetween(lw, ctx.date) : 400;
  const rep = p.repeatDays || 10;
  if (CORE.has(role)) { if (days >= 0 && days < rep) s -= ((rep - days) / rep) * 2.4; s += (Math.min(Math.max(days, 0), 60) / 60) * 0.8; }
  else if (role === 'layer') { if (days >= 0 && days < 4) s -= 0.6; s += (Math.min(Math.max(days, 0), 60) / 60) * 0.4; }
  if (wearsOf(it) < 3 && daysBetween(it.created || it.purchased || today(), today()) > 21) { s += 0.45; }
  if (it.fav) s += 0.5;
  const cols = it.colors || [];
  if (cols.some((c) => (p.favColors || []).includes(c))) s += 0.35;
  if ((p.avoidColors || []).includes(cols[0])) s -= 1.6;
  if ((it.occasions || []).includes(ctx.kind)) s += 0.8;
  s += Learn.itemBoost(it.id);
  // weekly variety / trip packing
  const n = ctx.used.get(it.id) || 0;
  if (ctx.packed) {
    if (ctx.packed.has(it.id)) s += role === 'top' ? -1.2 : role === 'dress' ? -1.6 : 2.2;
  } else if (n) s -= CORE.has(role) ? 2.6 * n : role === 'layer' ? 1.3 * n : role === 'outer' || role === 'bag' ? -0.2 : 0.25 * n;
  s += (Math.random() - 0.5) * ctx.jitter;
  return s;
}

function slotPool(ctx, role) {
  const cats = { top: ['top'], bottom: ['bottom'], dress: ['dress'], layer: ['layer'], outer: ['outerwear'], shoes: ['shoes'], bag: ['bag'], acc: ['accessory'] }[role];
  let pool = activeItems().filter((i) => cats.includes(i.cat) && !ctx.exclude.has(i.id));
  if (ctx.pool) pool = pool.filter((i) => ctx.pool.has(i.id));
  if (role === 'shoes') {
    pool = pool.filter((i) => i.sub !== 'Athletic shoes' || ctx.kind === 'active');
    if (!S.profile.heels && ctx.f < 4.5) pool = pool.filter((i) => i.sub !== 'Heels');
  }
  if (role === 'bottom' && ctx.kind !== 'active') pool = pool.filter((i) => i.sub !== 'Leggings' || ctx.f <= 2.5);
  return pool.map((it) => {
    let s = itemScore(it, ctx, role); if (s == null) return null;
    if (role === 'shoes') {
      if (ctx.rain && ['Sandals', 'Mules'].includes(it.sub)) s -= 2.5;
      if (ctx.rain && ['Rain boots', 'Ankle boots', 'Tall boots'].includes(it.sub) && it.material !== 'Suede') s += 1;
      if (['cold', 'frigid'].includes(ctx.tier)) { if (['Sandals'].includes(it.sub)) s -= 3; if (/boot/i.test(it.sub)) s += 0.9; }
      if (ctx.tier === 'cool' && it.sub === 'Sandals') s -= 1.8;
      if (['hot'].includes(ctx.tier) && /boot/i.test(it.sub)) s -= 1.5;
      if (ctx.comfortShoes) { if (it.sub === 'Heels') s -= 2.4; if (['Sneakers', 'Loafers / flats', 'Ankle boots'].includes(it.sub)) s += 0.9; }
    }
    if (role === 'outer') {
      const want = { hot: 0, warm: 1, mild: 2.5, cool: 3, cold: 4.5, frigid: 5 }[ctx.tier];
      s -= Math.abs((it.warmth ?? 3) - want) * 0.9;
      if (ctx.rain && ['Trench', 'Rain jacket'].includes(it.sub)) s += 1.8;
      if (ctx.rain && ['Wool coat', 'Leather jacket'].includes(it.sub)) s -= 0.4;
    }
    if (role === 'layer' && ctx.f >= 3.5 && it.sub === 'Blazer') s += 0.6;
    return { it, s };
  }).filter(Boolean).sort((a, b) => b.s - a.s);
}

/* colour + pattern harmony of a set of pieces */
function harmony(pieces) {
  const hues = []; let multi = 0; const keys = [];
  for (const it of pieces) {
    const slot = slotOf(it); if (slot === 'acc') continue;
    (it.colors || []).slice(0, 2).forEach((c, idx) => {
      const C = COLORS[c]; if (!C) return; keys.push(c);
      if (C.multi) multi++; else if (!C.n && !(C.soft && idx > 0)) hues.push(C.h);
    });
  }
  const uniq = []; for (const h of hues) if (!uniq.some((u) => hueDist(u, h) < 22)) uniq.push(h);
  let s = 0;
  if (uniq.length === 0) s += 0.6; else if (uniq.length === 1) s += 1;
  else if (uniq.length === 2) { const d = hueDist(uniq[0], uniq[1]); s += d <= 38 ? 0.7 : d >= 150 ? 0.35 : d >= 100 ? -0.2 : -0.9; }
  else s -= 0.9 * (uniq.length - 2) + 0.3;
  if (multi > 1) s -= 0.8;
  if (new Set(keys).size === 1 && keys.length >= 3) s += 0.4;
  const eclectic = (S.profile.styleWords || []).includes('Eclectic'), minimal = (S.profile.styleWords || []).includes('Minimal');
  const pats = pieces.filter((i) => CLOTHES.has(slotOf(i)) && i.pattern && !['Solid', 'Texture'].includes(i.pattern)).length;
  if (pats === 2) s -= eclectic ? 0.2 : 1.2; else if (pats > 2) s -= eclectic ? 1 : 2.6;
  if (minimal && pats >= 1) s -= 0.3;
  const metals = new Set(pieces.filter((i) => slotOf(i) === 'acc').flatMap((i) => (i.colors || []).filter((c) => COLORS[c]?.metal)));
  if (metals.size > 1) s -= 0.3;
  return s;
}
function hueDist(a, b) { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; }

function formulaBonus(byRole) {
  const p = S.profile; let best = 0, label = null;
  for (const f of FORMULAS) {
    const wanted = (p.formulas || []).includes(f.k); if (!wanted) continue;
    const slots = Object.entries(f.need); let hit = 0;
    for (const [slot, subs] of slots) { const it = byRole[slot]; if (it && subs.includes(it.sub)) hit++; }
    if (hit === slots.length) { const b = 1.6 * (p.formulaWeights?.[f.k] || 1); if (b > best) { best = b; label = f.label; } }
  }
  return { bonus: best, label };
}

function softPick(list, temp = 0.9, topK = 8) {
  const L = list.slice(0, topK); if (!L.length) return null;
  const mx = L[0].s; const ws = L.map((x) => Math.exp((x.s - mx) / temp)); let r = Math.random() * sum(ws);
  for (let i = 0; i < L.length; i++) { r -= ws[i]; if (r <= 0) return L[i]; }
  return L[L.length - 1];
}

function needOuter(ctx) { return ['cool', 'cold', 'frigid'].includes(ctx.tier) || (ctx.rain && ctx.tier !== 'hot'); }
function wantLayer(ctx) { return ctx.tier === 'mild' || ctx.tier === 'cool' || (ctx.f >= 3.5 && ctx.tier !== 'hot') || (ctx.tier === 'cold' && Math.random() < 0.4); }

/* Build one outfit. Returns {items:[ids], byRole, score, reasons, formula} */
function buildOutfit(ctx, tries = 36) {
  if (ctx.kind === 'active') return buildActive(ctx);
  const pools = {}; ['top', 'bottom', 'dress', 'layer', 'outer', 'shoes', 'bag', 'acc'].forEach((r) => (pools[r] = slotPool(ctx, r)));
  const lock = ctx.lock || {};
  const lockedItem = (r) => (lock[r] ? S.items.get(lock[r]) : null);
  const results = [];
  const preferDress = (S.profile.formulas || []).some((k) => FORMULAS.find((f) => f.k === k)?.need.dress);
  for (let t = 0; t < tries; t++) {
    const by = {}; const chosen = [];
    const add = (r, it) => { if (it) { by[r] = it; chosen.push(it); } };
    const pickFor = (r, extra = 0) => {
      if (lockedItem(r)) return lockedItem(r);
      const scored = pools[r].filter((x) => !chosen.includes(x.it)).slice(0, 14).map((x) => ({ it: x.it, s: x.s + harmony([...chosen, x.it]) * 1.1 + extra }));
      scored.sort((a, b) => b.s - a.s); return softPick(scored)?.it || null;
    };
    let dressMode;
    if (lock.dress) dressMode = true; else if (lock.top || lock.bottom) dressMode = false;
    else {
      const hasSep = pools.top.length && pools.bottom.length; const hasDress = pools.dress.length;
      const pD = !hasDress ? 0 : !hasSep ? 1 : clamp((ctx.f >= 4.5 ? 0.6 : ctx.kind === 'date' ? 0.45 : 0.22) + (preferDress ? 0.12 : 0) + (ctx.tier === 'hot' ? 0.1 : 0), 0, 0.9);
      dressMode = Math.random() < pD;
    }
    if (dressMode) add('dress', pickFor('dress')); else { add('top', pickFor('top')); add('bottom', pickFor('bottom')); }
    if (!chosen.length) continue;
    if (lock.layer || (pools.layer.length && wantLayer(ctx))) add('layer', pickFor('layer'));
    if (lock.outer || (pools.outer.length && needOuter(ctx))) add('outer', pickFor('outer'));
    add('shoes', pickFor('shoes'));
    if (ctx.kind !== 'lounge') add('bag', pickFor('bag'));
    // accessories: earrings/necklace first, weather-driven extras after
    const maxAcc = (S.profile.styleWords || []).includes('Minimal') ? 1 : (S.profile.accessories ?? 2);
    const accs = []; const subsUsed = new Set();
    if (lock.acc) { const a = S.items.get(lock.acc); if (a) { accs.push(a); subsUsed.add(a.sub); } }
    const accPool = pools.acc.map((x) => {
      let s = x.s;
      if (x.it.sub === 'Scarf') s += ['cold', 'frigid'].includes(ctx.tier) ? 1.5 : ctx.tier === 'cool' ? 0.2 : -3;
      if (x.it.sub === 'Sunglasses') s += ctx.sunny && ctx.tier !== 'frigid' ? 0.8 : -3;
      if (x.it.sub === 'Hat') s += ctx.tier === 'frigid' || (ctx.sunny && ['hot', 'warm'].includes(ctx.tier) && ctx.kind === 'outdoor') ? 1 : -2.5;
      if (['Earrings', 'Necklace', 'Watch'].includes(x.it.sub)) s += 0.5;
      return { it: x.it, s };
    }).sort((a, b) => b.s - a.s);
    for (const x of accPool) { if (accs.length >= maxAcc + (['cold', 'frigid'].includes(ctx.tier) ? 1 : 0)) break; if (subsUsed.has(x.it.sub) || x.s < -2) continue; accs.push(x.it); subsUsed.add(x.it.sub); }
    accs.forEach((a, k) => { chosen.push(a); by['acc' + k] = a; });

    let score = 0; for (const [r, it] of Object.entries(by)) { const role = r.startsWith('acc') ? 'acc' : r; score += pools[role]?.find((x) => x.it === it)?.s ?? 0; }
    score += harmony(chosen) * 2;
    const fb = formulaBonus(by); score += fb.bonus;
    score += Learn.pairBoost(chosen.map((i) => i.id));
    results.push({ by, chosen, score, formula: fb.label });
  }
  if (!results.length) return null;
  results.sort((a, b) => b.score - a.score);
  const best = results[0];
  return { items: best.chosen.map((i) => i.id), byRole: best.by, score: best.score, formula: best.formula, reasons: explain(best, ctx) };
}

function buildActive(ctx) {
  const act = activeItems().filter((i) => i.cat === 'active' && !ctx.exclude.has(i.id) && (!ctx.pool || ctx.pool.has(i.id)));
  const pickSub = (subs) => act.filter((i) => subs.includes(i.sub)).sort(by((i) => (lastWorn(i) || ''), 1))[0];
  const chosen = [];
  const top = pickSub(['Active top', 'Sports bra']) || activeItems().find((i) => i.cat === 'top' && ['Tee', 'Tank / cami'].includes(i.sub));
  const bot = pickSub(['Active leggings', 'Active shorts']) || activeItems().find((i) => i.sub === 'Leggings');
  const jk = ['cool', 'cold', 'frigid'].includes(ctx.tier) ? pickSub(['Active jacket']) : null;
  const shoes = activeItems().find((i) => i.sub === 'Athletic shoes') || activeItems().find((i) => i.sub === 'Sneakers');
  [top, bot, jk, shoes].forEach((x) => x && chosen.push(x));
  if (!chosen.length) return null;
  return { items: chosen.map((i) => i.id), byRole: {}, score: 0, reasons: ['Workout on the calendar, so this is your gym kit.'] };
}

function explain(res, ctx) {
  const out = []; const by = res.by; const wx = ctx.wx;
  if (by.outer) {
    if (ctx.rain) out.push(`${by.outer.name}: ${wx.rain}% chance of rain.`);
    else if (wx.lo != null) out.push(`${by.outer.name}: it drops to ${tempOut(wx.lo)}.`);
  }
  if (by.shoes) {
    const sh = ctx.events.filter((e) => e.kind === 'showing').length;
    if (ctx.comfortShoes && sh) out.push(`${by.shoes.name}: you’re on your feet for ${plural(sh, 'showing')}.`);
    else if (ctx.rain && !/sandal/i.test(by.shoes.sub)) out.push(`${by.shoes.name}: closed toes for the wet weather.`);
  }
  const keyEv = ctx.events.find((e) => e.kind === ctx.kind);
  if (keyEv && ctx.kind !== 'casual') out.push(`Dressed for “${keyEv.title}” (${DRESS_LEVELS[Math.round(ctx.f)].toLowerCase()}).`);
  if (res.formula) out.push(`One of your go-to formulas: ${res.formula.toLowerCase()}.`);
  const sleeper = res.chosen.filter((i) => CORE.has(slotOf(i)) || slotOf(i) === 'layer').map((i) => ({ i, d: lastWorn(i) ? daysBetween(lastWorn(i), ctx.date) : null })).sort((a, b) => (b.d ?? 999) - (a.d ?? 999))[0];
  if (sleeper && (sleeper.d == null || sleeper.d > 30)) out.push(sleeper.d == null ? `${sleeper.i.name} hasn’t been worn yet. Today’s the day.` : `${sleeper.i.name} hasn’t been out in ${sleeper.d} days.`);
  if (ctx.also.includes('active')) { const a = ctx.events.find((e) => e.kind === 'active'); out.push(`Pack your workout clothes for ${a?.title || 'your workout'}${a?.time ? ' at ' + a.time : ''}.`); }
  if (ctx.sunny && res.chosen.some((i) => i.sub === 'Sunglasses')) out.push('Sunny, so sunglasses are in.');
  return out.slice(0, 4);
}

function outfitTitle(ctx) {
  const w = ctx.rain ? 'rainy' : { hot: 'hot', warm: 'warm', mild: 'mild', cool: 'cool', cold: 'cold', frigid: 'freezing' }[ctx.tier];
  return `${KINDS[ctx.kind]?.label || 'Everyday'} · ${w}`;
}

/* ---------- learning from what you wear and love ---------- */
const Learn = {
  cache: null, stamp: 0,
  build() {
    const love = new Map(), meh = new Map(), pairs = new Map();
    const addPair = (ids, w) => { const core = ids.filter((id) => { const it = S.items.get(id); return it && CLOTHES.has(slotOf(it)); }); for (let a = 0; a < core.length; a++) for (let b = a + 1; b < core.length; b++) { const k = [core[a], core[b]].sort().join('|'); pairs.set(k, (pairs.get(k) || 0) + w); } };
    for (const e of logEntries()) { if (e.rating === 'love') { e.items.forEach((id) => love.set(id, (love.get(id) || 0) + 1)); addPair(e.items, 1); } if (e.rating === 'meh') e.items.forEach((id) => meh.set(id, (meh.get(id) || 0) + 1)); }
    for (const o of S.outfits.values()) addPair(o.items || [], o.fav ? 1.5 : 0.8);
    this.cache = { love, meh, pairs }; this.stamp = Date.now();
  },
  get() { if (!this.cache || Date.now() - this.stamp > 4000) this.build(); return this.cache; },
  itemBoost(id) { const c = this.get(); return Math.min(0.6, (c.love.get(id) || 0) * 0.15) - Math.min(0.9, (c.meh.get(id) || 0) * 0.3); },
  pairBoost(ids) { const c = this.get(); let s = 0; for (let a = 0; a < ids.length; a++) for (let b = a + 1; b < ids.length; b++) s += Math.min(1, (c.pairs.get([ids[a], ids[b]].sort().join('|')) || 0) * 0.5); return Math.min(1.5, s); },
};

/* ---------- week plans ---------- */
function weekKeyOf(date) { return weekStartOf(date, S.profile.weekStartDow ?? 1); }
function planDay(date, opts = {}) {

};
function compatible(a, b) { return Math.abs((a.formality ?? 3) - (b.formality ?? 3)) <= 1.6 && harmony([a, b]) > -0.5; }
function buildCapsule(key) {

    const cand = pool.filter((i) => i.cat === cats && !pick.includes(i));

  take('outer', P.size.outer, (i) => (COLORS[(i.colors || [])[0]]?.n ? 0.8 : 0) + (season === 'winter' ? (i.warmth ?? 3) * 0.2 : 0));
  take('shoes', P.size.shoes, (i) => (COLORS[(i.colors || [])[0]]?.n ? 0.8 : 0) + pick.filter((p) => CORE.has(slotOf(p)) && compatible(i, p)).length * 0.15);

const STAPLES = [

function closetGaps() {
  const act = activeItems(); if (act.length < 6) return { staples: [], notes: [] };
  const owns = (cat, sub, col) => act.some((i) => i.cat === cat && i.sub === sub && (COLORS[(i.colors || [])[0]]?.n === COLORS[col]?.n) && ((i.colors || [])[0] === col || Math.abs(luminance(primaryColor(i).hex) - luminance(COLORS[col].hex)) < 0.12));

    const partners = cat === 'top' ? act.filter((i) => i.cat === 'bottom') : cat === 'bottom' ? act.filter((i) => i.cat === 'top') : act.filter((i) => ['top', 'bottom', 'dress'].includes(i.cat));

  if (!has((i) => ['Rain jacket', 'Trench'].includes(i.sub))) notes.push('Nothing rain-ready to wear over your clothes.');
  if (!has((i) => i.cat === 'shoes' && /boot|Sneakers|Loafers/.test(i.sub) && i.material !== 'Suede')) notes.push('No closed shoes that can handle wet sidewalks.');
  if (!has((i) => (i.formality ?? 3) >= 4.5 && ['dress', 'bottom', 'top'].includes(i.cat))) notes.push('Nothing formal enough for a black-tie invitation.');
  const nb = act.filter((i) => i.cat === 'bottom' && COLORS[(i.colors || [])[0]]?.n).length, nt = act.filter((i) => i.cat === 'top').length;
  if (nt >= 8 && nb <= 2) notes.push(`${nt} tops but only ${nb} neutral bottoms, so many tops share the same two partners.`);
  if (Cal.hasKind('active') && !has((i) => i.cat === 'active')) notes.push('Workouts on your calendar but no activewear in your closet.');

/* ---------- Gmail order emails (inside Claude) ---------- */
const Mail = {
  async find(retailerQ) {
    const mcp = await window.claude?.use?.('mcp').catch(() => null); if (!mcp) throw { code: 'unavailable' };
    const from = retailerQ || GMAIL_STORES;
    const q = `from:(${from}) (subject:(order OR confirmation OR receipt OR shipped OR purchase OR "your fix" OR checkout) OR category:purchases) newer_than:3y`;
    const out = []; let token;
    for (let page = 0; page < 3; page++) {
      const input = { query: q, pageSize: 50, view: 'THREAD_VIEW_SUMMARY' }; if (token) input.pageToken = token;
      const r = await mcp.callTool('Gmail', 'search_threads', input, { cache: false });
      const p = r.payload || {};
      (p.threads || []).forEach((t) => { const m = (t.messages || [])[0] || {}; out.push({ id: t.id, subject: m.subject || '(no subject)', from: m.addressDisplayNames?.[0]?.displayName || m.sender || '', date: (m.date || '').slice(0, 10), snippet: m.snippet || '' }); });
      token = p.nextPageToken; if (!token || out.length >= 120) break;
    }
    return out;
  },
  async read(threadId) {
    const mcp = await window.claude.use('mcp');
    const r = await mcp.callTool('Gmail', 'get_thread', { threadId, messageFormat: 'PLAIN_TEXT' }, { cache: false });
    const msgs = r.payload?.messages || [];
    const m = msgs.find((x) => x.plaintextBody) || msgs[0] || {};
    return { text: String(m.plaintextBody || m.snippet || '').slice(0, 14000), subject: m.subject || '', from: m.sender || '', date: (m.date || '').slice(0, 10) };
  },
};

async function saveFile(filename, data, type = 'application/json') {

    const s = slotOf(it);

function viewToday() {

      <div class="small">${esc(wxLabel(w))} · low ${tempOut(w.rawLo ?? w.lo)}</div>
      <div class="xs muted">${loc ? `${w.rain ?? 0}% rain · ${esc(loc.name.split(',')[0])}` : 'Estimate · set your city'}</div>
    </button>
  </section>
  ${Weather.status ? `<div class="note">${icon('info')}<span>${esc(Weather.status)}</span></div>` : ''}
  <section class="outfit-card">
    <div>${boardHTML(ids, { act: 'swap', date: d, locks, empty: `<div class="stack" style="align-items:center">${emptyArt()}<p>No outfit yet for today.</p><button class="btn primary" data-act="shuffle" data-date="${d}">${icon('sparkles')}Style me</button></div>` })}</div>
    <div class="stack" style="gap:16px">
      <div><div class="eyebrow">Today’s outfit</div><h2 class="display" style="font-size:30px;line-height:1.1;margin-top:4px">${esc(day?.title || outfitTitle(ctx))}</h2></div>
      ${(day?.reasons || []).length ? `<ul class="why">${day.reasons.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
      ${evs.length ? `<div class="events">${evs.slice(0, 5).map((e) => `<div class="ev"><span class="t">${esc(e.allDay ? 'All day' : e.time)}</span>${e.kind ? `<span class="badge">${esc(KINDS[e.kind].label)}</span>` : ''}<span class="n">${esc(e.title)}</span></div>`).join('')}</div>` : `<p class="small muted">${icon('calendar', 'xs')} Nothing on the calendar${Cal.gState === 'on' || S.profile.icsImported ? '' : ' that Valet can see. Connect a calendar in Profile.'}</p>`}
      ${ids.length ? (worn ? `<div class="note accent">${icon('check')}<div class="grow"><strong>Logged as worn.</strong> How did it feel?
          <div class="row" style="margin-top:8px"><button class="chip" aria-pressed="${day.rating === 'love'}" data-act="rate" data-v="love" data-date="${d}">${icon('heart')}Loved it</button><button class="chip" aria-pressed="${day.rating === 'meh'}" data-act="rate" data-v="meh" data-date="${d}">Not quite</button><button class="chip" data-act="unwear" data-date="${d}">Undo</button></div></div></div>`
        : `<div class="actions"><button class="btn primary" data-act="wear" data-date="${d}">${icon('check')}I wore this</button><button class="btn" data-act="shuffle" data-date="${d}">${icon('shuffle')}Shuffle</button><button class="btn" data-act="save-look" data-date="${d}">${icon('heart')}Save look</button>${AI.on ? `<button class="btn" data-act="stylist" data-date="${d}">${icon('sparkles')}Ask Claude</button>` : ''}</div>
           <p class="xs muted">Tap any piece to swap it or lock it in place before shuffling.</p>`) : ''}

      ${tday?.items?.length ? miniHTML(tday.items) : `<button class="btn block" data-act="shuffle" data-date="${tm}">${icon('sparkles')}Plan tomorrow</button>`}

}

function nudgesHTML() {
  const out = []; const t = today();
  if (itemsArr((i) => i.sample).length) out.push(`<div class="note accent">${icon('info')}<div class="grow">You’re exploring a sample closet. <button class="btn quiet sm" data-act="remove-sample">Remove sample pieces</button></div></div>`);
  if (!S.profile.interviewDone) out.push(`<button class="li-btn" data-act="interview">${icon('sparkles')}<span class="grow"><strong>Take the style interview</strong><br><span class="small muted">Three minutes, and every outfit gets more you.</span></span>${icon('right')}</button>`);
  if (!S.profile.location) out.push(`<button class="li-btn" data-act="edit-location">${icon('pin')}<span class="grow"><strong>Add your city</strong><br><span class="small muted">So outfits follow the real forecast.</span></span>${icon('right')}</button>`);
  const trip = [...S.trips.values()].filter((x) => x.end >= t).sort(by((x) => x.start))[0];
  if (trip && daysBetween(t, trip.start) <= 14) out.push(`<button class="li-btn" data-act="trip" data-id="${trip.id}">${icon('suitcase')}<span class="grow"><strong>${esc(trip.dest?.name?.split(',')[0] || trip.name)} ${trip.start <= t ? 'now' : 'in ' + plural(daysBetween(t, trip.start), 'day')}</strong><br><span class="small muted">Packing list: ${plural(Object.keys(trip.packList || {}).length, 'piece')}</span></span>${icon('right')}</button>`);
  const laundry = itemsArr((i) => i.status === 'laundry');
  if (laundry.length) out.push(`<div class="li">${icon('wash')}<span class="grow"><strong>${plural(laundry.length, 'piece')} in the laundry</strong><br><span class="small muted">Left out of outfits until they’re back.</span></span><button class="btn sm" data-act="all-clean">All clean</button></div>`);
  const sleepers = activeItems().filter((i) => !['accessory'].includes(i.cat) && daysBetween(i.created || t, t) > 30 && (!lastWorn(i) || daysBetween(lastWorn(i), t) > 60)).sort(by((i) => lastWorn(i) || '0')).slice(0, 4);
  if (sleepers.length) out.push(`<div class="stack" style="gap:8px;padding:12px 0"><div><strong>Forgotten favorites?</strong> <span class="small muted">Not worn in 60+ days.</span></div><div class="capsule-strip" style="grid-template-columns:repeat(4,1fr)">${sleepers.map((i) => pieceHTML(i, { cls: 'sm', act: 'item' })).join('')}</div></div>`);
  if (dow(t) === (S.profile.planDow ?? 0)) { const nx = addDays(weekKeyOf(t), 7); if (S.plans.get(nx)?.generated) out.push(`<a class="li-btn" href="#week" data-act="week-next">${icon('week')}<span class="grow"><strong>Next week is planned</strong><br><span class="small muted">Week of ${fmtShort(nx)}. Swap anything you like.</span></span>${icon('right')}</a>`); }
  return out.length ? `<div class="list">${out.join('')}</div>` : `<p class="muted small">Nothing needs you right now.</p>`;
}

/* ---------- Week ---------- */
function weekTabs(cur) { return `<div class="seg" role="group"><button aria-pressed="${cur === 'plan'}" data-act="nav" data-r="week">Plan</button><button aria-pressed="${cur === 'trips'}" data-act="nav" data-r="trips">Trips</button></div>`; }
function viewWeek() {
  const base = weekKeyOf(today()); const wk = addDays(base, 7 * UI.weekOffset); const plan = S.plans.get(wk);
  const label = UI.weekOffset === 0 ? 'This week' : UI.weekOffset === 1 ? 'Next week' : UI.weekOffset === -1 ? 'Last week' : `Week of ${fmtShort(wk)}`;
  const dates = [...Array(7)].map((_, i) => addDays(wk, i)); const t = today();
  const all = dates.flatMap((d) => (plan?.days?.[d]?.items || []).filter((id) => S.items.get(id)));
  const core = all.filter((id) => CORE.has(slotOf(S.items.get(id))));
  const repeats = core.length - new Set(core).size;
  const head = `<div class="page-head"><div><div class="eyebrow">${fmtShort(wk)} – ${fmtShort(addDays(wk, 6))}</div><h1 class="page-title">${label}</h1></div>${weekTabs('plan')}</div>
    <div class="row between wrap"><div class="row"><button class="iconbtn" data-act="week-nav" data-d="-1" aria-label="Previous week">${icon('left')}</button><button class="btn sm" data-act="week-nav" data-d="0">Today</button><button class="iconbtn" data-act="week-nav" data-d="1" aria-label="Next week">${icon('right')}</button></div>
    ${S.items.size ? `<button class="btn ${plan?.generated ? '' : 'primary'} sm" data-act="plan-week" data-wk="${wk}">${icon('sparkles')}${plan?.generated ? 'Re-plan open days' : 'Plan this week'}</button>` : ''}</div>`;
  if (!S.items.size) return head + `<div class="empty">${emptyArt()}<h3>Your week starts with your closet</h3><p>Add a handful of pieces and Valet lays out seven days of outfits, matched to the forecast and your calendar.</p><button class="btn primary" data-act="add">${icon('plus')}Add pieces</button></div>`;
  const cards = dates.map((d) => {
    const day = plan?.days?.[d]; const ctx = dayContext(d, { kindSet: day?.kindSet, wx: day?.wx }); const past = d < t;
    const evs = ctx.events.filter((e) => e.kind || !e.allDay).slice(0, 2);
    return `<button class="day ${d === t ? 'is-today' : ''} ${past ? 'past' : ''}" data-act="day" data-date="${d}">
      <div class="day-h"><span class="day-name">${DOW_LONG[dow(d)]}</span><span class="muted small num">${fmtShort(d)}</span></div>
      <div class="day-meta">${wxInline(ctx.wx)}<span>·</span>${kindIcon(ctx.kind)}<span>${esc(KINDS[ctx.kind].label)}</span></div>
      ${day?.items?.length ? miniHTML(day.items) : `<div class="mini" style="grid-template-columns:1fr"><div class="piece" style="aspect-ratio:4/1.2;font-size:12.5px;color:#888">${past ? 'Nothing logged' : 'Tap to plan'}</div></div>`}
      ${evs.length ? `<div class="events">${evs.map((e) => `<div class="ev"><span class="t">${esc(e.time || 'All day')}</span><span class="n small">${esc(e.title)}</span></div>`).join('')}</div>` : ''}
      <div class="row wrap">${day?.worn ? `<span class="badge good">${icon('check', 'xs')} Worn</span>` : ''}${day?.locked ? `<span class="badge">${icon('lock', 'xs')} Locked</span>` : ''}${forecastShift(day, d) ? `<span class="badge warn">Forecast changed</span>` : ''}${ctx.also.includes('active') ? `<span class="badge accent">+ gym kit</span>` : ''}</div>
    </button>`;
  }).join('');
  const stats = plan?.generated ? `<div class="note">${icon('info')}<span>${plural(new Set(all).size, 'piece')} across the week${repeats ? `, ${plural(repeats, 'core piece')} repeated` : ', no tops, bottoms or dresses repeated'}. ${Weather.src && Weather.src !== 'live' ? esc(Weather.srcLabel(Weather.src)) + ' used for weather.' : ''}</span></div>` : '';
  return head + stats + `<div class="week">${cards}</div>`;
}

/* ---------- Trips ---------- */

      ${Object.keys(x.packList || {}).length ? `<div class="capsule-strip">${Object.keys(x.packList).map((id) => S.items.get(id)).filter(Boolean).slice(0, 12).map((i) => pieceHTML(i, { cls: 'sm' })).join('')}</div>` : ''}

/* ---------- Closet ---------- */
function closetFiltered() {
  const C = UI.closet; const q = C.q.trim().toLowerCase();
  let list = itemsArr((i) => (C.status === 'all' ? i.status !== 'retired' : (i.status || 'active') === C.status) && (C.cat === 'all' || i.cat === C.cat));
  if (q) list = list.filter((i) => `${i.name} ${i.brand} ${i.store} ${i.sub} ${(i.colors || []).map((c) => COLORS[c]?.label).join(' ')} ${i.material} ${i.notes}`.toLowerCase().includes(q));
  const sorts = { recent: by((i) => i.purchased || i.created || '', -1), worn: by(wearsOf, -1), least: by((i) => wearsOf(i) + (lastWorn(i) ? 0 : -0.5)), cpw: by((i) => cpw(i) ?? -1, -1), price: by((i) => i.price || 0, -1), name: by((i) => i.name.toLowerCase()), last: by((i) => lastWorn(i) || '') };

}

  const counts = {}; all.forEach((i) => { if ((i.status || 'active') === C.status || C.status === 'all') counts[i.cat] = (counts[i.cat] || 0) + 1; });

    <div class="chips scroll" role="group" aria-label="Status">${[['active', 'In rotation'], ['laundry', 'Laundry'], ['tailor', 'Tailor'], ['storage', 'Storage'], ['donate', 'Donate / sell'], ['all', 'Everything']].map(([k, l]) => `<button class="chip soft" aria-pressed="${C.status === k}" data-act="closet-status" data-v="${k}">${l}</button>`).join('')}</div>

}
function closetGridHTML() {

/* ---------- Looks + capsules ---------- */
function viewLooks() {

      : `<div class="empty"><h3>No saved looks yet</h3><p>Save an outfit from Today or the Week, or build one here piece by piece.</p></div>`}`;
}
let capsuleCache = { stamp: '', list: [] };
function capsulesHTML() {

function ideasHTML() {
